[project]
name = "url-shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "romanplakhota",email = "loram.hoptan@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.128.7,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.1,<0.16.0)"
]

[tool.ruff]

exclude = [
    ".venv",
    "alembic",
    "pycache",
    ".pytest_cache",
    ".ruff_cache",
    ".env",
    ".env.*"
]

line-length = 100
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "N", "FAST", "ANN", "YTT"]

ignore = []
